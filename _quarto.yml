project:
  type: book
  output-dir: _book

book:
  title: "深度学习与生成式 AI：课后练习"
  subtitle: "R torch 核心算法与实战 · 配套主书第 3–15 章"
  author: "刘思喆"
  date: today
  reader-mode: true
  page-navigation: true

  chapters:
    - index.qmd
    - 03-math-ml-exercises.qmd
    - 04-backforward-nn-exercises.qmd
    - 05-optimizer-exercises.qmd
    - 06-regularization-exercises.qmd
    - 07-convolution-exercises.qmd
    - 08-rnn-lstm-exercises.qmd
    - 09-transformer-exercises.qmd
    - 10-recsys-exercises.qmd
    - 11-gnn-exercises.qmd
    - 12-vae-exercises.qmd
    - 13-GAN-exercises.qmd
    - 14-diffusion-exercises.qmd
    - 15-explainable-ai-exercises.qmd

lang: zh

format:
  html:
    theme: united
    css: theme.css
    toc: true
    toc-depth: 3
    toc-title: "本页目录"
    number-sections: false
    code-fold: false
    highlight-style: arrow
    reference-location: block
    citation-location: document
    mermaid-format: png   # PDF 推荐，默认即 png
    grid:
      sidebar-width: 270px
      body-width: 880px
      margin-width: 240px
      gutter-width: 1.4em
